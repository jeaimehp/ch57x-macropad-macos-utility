name: MicroPadStudio
options:
  bundleId: com.micropadstudio.app
  deploymentTarget:
    macOS: "14.0"
packages:
  Yams:
    url: https://github.com/jpsim/Yams
    exactVersion: 6.2.2
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_HARDENED_RUNTIME: NO
targets:
  MicroPadStudio:
    type: application
    platform: macOS
    sources:
      - path: MicroPadStudio
      - path: vendor/ch57x-keyboard-tool
        buildPhase: resources
    dependencies:
      - package: Yams
    settings:
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_BUNDLE_IDENTIFIER: com.micropadstudio.app
        PRODUCT_MODULE_NAME: "$(TARGET_NAME)"
