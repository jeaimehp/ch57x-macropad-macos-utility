name: MicroPadStudio
options:
  bundleId: com.micropadstudio.app
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_HARDENED_RUNTIME: NO
targets:
  MicroPadStudio:
    type: application
    platform: macOS
    sources:
      - path: MicroPadStudio
    settings:
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_BUNDLE_IDENTIFIER: com.micropadstudio.app
        PRODUCT_MODULE_NAME: "$(TARGET_NAME)"
