name: MicroPadStudio
options:
  bundleId: com.micropadstudio.app
  deploymentTarget:
    macOS: "14.0"
packages:
  Yams:
    url: https://github.com/jpsim/Yams
    exactVersion: 6.2.2
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_HARDENED_RUNTIME: NO
targets:
  MicroPadStudio:
    type: application
    platform: macOS
    sources:
      - path: MicroPadStudio
      - path: vendor/ch57x-keyboard-tool
        buildPhase: resources
      - path: templates
        type: folder
        buildPhase: resources
    dependencies:
      - package: Yams
    settings:
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_BUNDLE_IDENTIFIER: com.micropadstudio.app
        PRODUCT_MODULE_NAME: "$(TARGET_NAME)"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MicroPadMenu:
    type: application
    platform: macOS
    sources:
      - path: MicroPadMenu
      - path: MicroPadStudio/Model
      - path: MicroPadStudio/Services/Ch57xTool.swift
      - path: MicroPadStudio/Services/ConfigLibrary.swift
      - path: MicroPadStudio/Services/DeviceMonitor.swift
      - path: MicroPadStudio/Services/PadState.swift
      - path: MicroPadStudio/Assets.xcassets
      - path: vendor/ch57x-keyboard-tool
        buildPhase: resources
      - path: templates
        type: folder
        buildPhase: resources
    dependencies:
      - package: Yams
    settings:
      base:
        PRODUCT_NAME: "MicroPad Menu"
        PRODUCT_BUNDLE_IDENTIFIER: com.micropadstudio.menu
        PRODUCT_MODULE_NAME: MicroPadMenu
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSUIElement: YES
