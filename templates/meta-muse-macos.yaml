# @title Meta Muse (macOS)
# @summary Meta's Muse AI assistant on a Mac — open it, talk to it, hear replies, share screenshots. Open Muse (F13) and Dictate (F14) are handled by the MicroPad Menu helper, which opens/focuses Muse first. Dictate and Read Response use built-in macOS speech features; Stop is a common chat-app convention, unverified for Muse.
# @note b1-1 Open Muse | Opens Muse, or brings its window to the front if it's already running (F13 — handled by the MicroPad Menu helper, which must be running).
# @note b1-2 Dictate | Tap to start: brings Muse to the front (opening it if needed) and starts macOS Dictation in its chat box. Tap again to stop (text is kept). F14 — handled by MicroPad Menu (needs Accessibility once).
# @note b1-3 Read Response | Select Muse's reply, press to have your Mac read it aloud; press again to stop. One-time setup: System Settings → Accessibility → Spoken Content → "Speak selection" On (shortcut ⌥Esc).
# @note b2-1 Screenshot → clipboard | ⌃⌘⇧4 lets you drag a screen area to the clipboard — then press the knob to paste it into Muse.
# @note b2-2 Stop | Esc usually stops a reply in progress (unverified for Muse).
# @note b2-3 Send | ⏎ sends your prompt.
# @note knob-ccw Scroll up | Scrolls back through the conversation.
# @note knob-press Paste | ⌘V pastes text or a screenshot into the prompt.
# @app f13 com.meta.endo
# @app f14 com.meta.endo +dictate
# @note knob-cw Scroll down | Scrolls forward through the conversation.
#

model: ch57x-2
orientation: normal
rows: 2
columns: 3
knobs: 1

layers:
  - buttons:
      - ["f13", "f14", "alt-escape"]
      - ["ctrl-cmd-shift-4", "escape", "enter"]
    knobs:
      - ccw: "wheelup"
        press: "cmd-v"
        cw: "wheeldown"
